# Tuned for a ~12GB machine: modest heap, capped metaspace and workers,
# no parallel execution — prevents the native OOM crashes (hs_err_pid*)
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
